[package]
name = "error_handaling"
version = "0.1.0"
edition = "2024"

[profile.release]
# set the behavior when panic
# default is 'unwind': which means Rust walks back up the stack and cleans up the data from each function it encounters.
# set to 'abort' means immediately abort, ends the program without cleaning up.
panic = 'abort'

